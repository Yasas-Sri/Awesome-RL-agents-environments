    runs_on: cloud
    use: train
    license: Apache-2.0
    last_commit: 2026-11-21

  - name: Unsloth
    repo: unslothai/unsloth
    section: trainers
    desc: Memory-efficient fine-tuning, including GRPO, aimed at single consumer GPUs and Colab.
    use_when: You're on free or limited compute.
    interface: library
    reward: mixed
    multi_turn: false
    runs_on: cloud
    use: train
