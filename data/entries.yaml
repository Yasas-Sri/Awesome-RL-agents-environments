  - name: SkyRL
    repo: NovaSky-AI/SkyRL
    section: trainers
    desc: Modular full-stack RL library for long-horizon agents; used in SWE-Gym and SWE-smith recipes.
    use_when: You're training SWE agents.
    interface: library
    reward: mixed
    multi_turn: true
    runs_on: cloud
    use: train
    license: Apache-2.0
    last_commit: 2026-11-20

  - name: slime
    repo: THUDM/slime
    section: trainers
    desc: Large-scale RL framework used to train the GLM model family.
    use_when: You're doing frontier-scale RL.
    interface: library
    reward: mixed
    multi_turn: true
    runs_on: cloud
    use: train
    license: Apache-2.0
    last_commit: 2026-11-06

  - name: OpenRLHF
    repo: OpenRLHF/OpenRLHF
    section: trainers
    desc: Ray-based RLHF and RL framework.
    use_when: You already run Ray clusters.
    interface: library
    reward: mixed
    multi_turn: true
    runs_on: cloud
    use: train
    license: Apache-2.0
    last_commit: 2026-11-03
